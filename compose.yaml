services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-risk-intelligence-api
    ports:
      - "8000:8000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ai_risk
      MYSQL_USER: ai_app
      MYSQL_PASSWORD: ai_app_password

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: ai-risk-intelligence-mysql
    environment:
      MYSQL_DATABASE: ai_risk
      MYSQL_USER: ai_app
      MYSQL_PASSWORD: ai_app_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uai_app",
          "-pai_app_password"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: